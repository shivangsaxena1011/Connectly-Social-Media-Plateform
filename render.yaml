services:
  - type: web
    name: connectly
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn connectly.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: connectly-db
          property: connectionString

databases:
  - name: connectly-db
    databaseName: connectly
    user: connectly
